/* Mapeia as chaves "bolao:..." para documentos do Firestore.
   - "bolao:pred:{slug}" -> coleção "preds", documento {slug}
   - demais chaves        -> coleção "bolao",  documento da chave (sem o prefixo) */
function ref(k){
  if(k.startsWith('bolao:pred:')) return doc(db,'preds',k.slice('bolao:pred:'.length));
  return doc(db,'bolao', k.replace('bolao:',''));
}
const store = {
  async get(k){
    try{ const s=await getDoc(ref(k)); return s.exists()? {key:k, value:s.data().v} : null; }
    catch(e){ console.error('get',k,e); return null; }
  },
  async set(k,v){
    try{ await setDoc(ref(k), {v}); }catch(e){ console.error('set',k,e); }
    return {key:k, value:v};
  },
  async del(k){
    try{ await deleteDoc(ref(k)); }catch(e){ console.error('del',k,e); }
    return {deleted:true};
  },
  async list(p){
    // só usamos list para os palpites (prefixo "bolao:pred:")
    if(p==='bolao:pred:'){
      try{ const snap=await getDocs(collection(db,'preds'));
        return {keys: snap.docs.map(d=>'bolao:pred:'+d.id)}; }
      catch(e){ console.error('list',e); return {keys:[]}; }
    }
    return {keys:[]};
  }
};

const DOW=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const ROUND_LABEL={'1':'1ª Rodada','2':'2ª Rodada','3':'3ª Rodada'};
/* Fuso UTC de cada cidade-sede em junho/julho 2026 */
const CITY_OFFSET={

}

    const dow=DOW[new Date(date+'T12:00:00Z').getUTCDay()];
    const off=CITY_OFFSET[city]||'-04:00';
    return {
      id:'r'+r+'-'+String(i).padStart(3,'0'),
      rodada:ROUND_LABEL[r]||r,
      ord:parseInt(r,10),
      dia:`${dow}, ${D}/${M}`,
      diaSort:date,
      hora:time,
      kickoff:`${date}T${time}:00${off}`,
      home, away, city
    };
  });
}

/* ============ State ============ */

let ROSTER=[]; // lista oficial de participantes (definida pelo organizador)
let authedSlug=''; // pessoa autenticada na sessão atual

const slug=s=>s.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const $=id=>document.getElementById(id);
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800);}
const outcome=(h,a)=> h>a?'H':(h<a?'A':'D');
const LOCK_BUFFER=30*60*1000; // palpite fecha 30 min antes do início
const isLocked=m=> Date.now() > (new Date(m.kickoff).getTime() - LOCK_BUFFER);
const closeTime=m=>{
  // fecha 30 min antes do início — exibido em HORÁRIO DE BRASÍLIA
  const d=new Date(new Date(m.kickoff).getTime()-LOCK_BUFFER);
  return d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',timeZone:'America/Sao_Paulo'});
};
const shortRound=r=> r.replace(' Rodada','');

/* Pontuação base (palpite x resultado), SEM o bônus de "sozinho":
   +3 acerto do resultado (vencedor/empate) · +1 por cada equipe cujo nº de gols acertou */
function baseScore(pred,res){
  if(!pred||!res) return null;
  if(pred.h===''||pred.a===''||res.h===''||res.a===''||pred.h==null||pred.a==null) return null;
  const ph=+pred.h, pa=+pred.a, rh=+res.h, ra=+res.a;
  let pts=0;
  if(outcome(ph,pa)===outcome(rh,ra)) pts+=3; // acertou vencedor/perdedor ou empate
  if(ph===rh) pts+=1;                          // acertou nº de gols do mandante
  if(pa===ra) pts+=1;                          // acertou nº de gols do visitante
  return pts;
}
const isExact=(pred,res)=> pred&&res&&pred.h!=null&&pred.a!=null&&res.h!==''&&res.a!=='' && +pred.h===+res.h && +pred.a===+res.a;
/* compatibilidade: pointsFor continua existindo e retorna a pontuação base */
function pointsFor(pred,res){ return baseScore(pred,res); }
/* Conta quantos participantes cravaram o placar exato de um jogo (para o bônus de sozinho).
   `allPeople` é a lista de objetos {preds}. */
function countExact(matchId,res,allPeople){
  if(!res||res.h===''||res.a==='') return 0;
  let n=0;
  for(const p of allPeople){ const pr=p.preds&&p.preds[matchId]; if(isExact(pr,res)) n++; }
  return n;
}
const SOLO_BONUS=5;

/* ============ Load ============ */
async function loadAll(){
  const m=await store.get('bolao:matches');
  MATCHES = (m&&m.value)? JSON.parse(m.value) : buildDefaults();
  // Corrige nomes das vagas de repescagem caso a base tenha sido salva antes da definição dos times
  const REP_FIX={
    'Repescagem UEFA-A':'Rep. Tcheca','Repescagem UEFA-B':'Bósnia e Herzegovina',
    'Repescagem UEFA-C':'Turquia','Repescagem UEFA-D':'Suécia',
    'Repescagem Inter.1':'Iraque','Repescagem Inter.2':'RD Congo'
  };
  let fixed=false;
  MATCHES.forEach(mt=>{
    if(REP_FIX[mt.home]){mt.home=REP_FIX[mt.home];fixed=true;}
    if(REP_FIX[mt.away]){mt.away=REP_FIX[mt.away];fixed=true;}
  });
  // Re-sincroniza a fase de grupos com a tabela oficial da FIFA (datas e horários LOCAIS).
  // Mantém resultados já lançados (guardados à parte) e jogos do mata-mata adicionados manualmente.
  const SCHED_VER='fifa-local-1';
  const verRec=await store.get('bolao:schedver');
  if(!verRec || (verRec.value!==SCHED_VER)){
    const defs={}; buildDefaults().forEach(d=>defs[d.id]=d);
    MATCHES.forEach(mt=>{
      const d=defs[mt.id];
      if(d){ mt.rodada=d.rodada; mt.ord=d.ord; mt.dia=d.dia; mt.diaSort=d.diaSort;
             mt.hora=d.hora; mt.kickoff=d.kickoff; mt.city=d.city;
             mt.home=d.home; mt.away=d.away; }
    });
    fixed=true;
    await store.set('bolao:schedver', SCHED_VER);
  }
  if(!m || fixed) await store.set('bolao:matches', JSON.stringify(MATCHES));
  const r=await store.get('bolao:results'); RESULTS = (r&&r.value)?JSON.parse(r.value):{};
  const c=await store.get('bolao:config'); CONFIG = (c&&c.value)?JSON.parse(c.value):{pin:null};
  // Lista oficial de participantes (cadastrada pelo organizador)
  const rs=await store.get('bolao:roster'); ROSTER = (rs&&rs.value)?JSON.parse(rs.value):[];
  // Migração única para o sistema de identidade fechada: descarta palpites antigos (nome digitado livre)
  const idv=await store.get('bolao:identver');
  if(!idv || idv.value!=='roster-1'){
    const l=await store.list('bolao:pred:');
    for(const k of (l.keys||[])){ await store.del(k); }
    await store.set('bolao:identver','roster-1');
  }
  await refreshNames();
}
async function refreshNames(){
  const rs=await store.get('bolao:roster'); ROSTER = (rs&&rs.value)?JSON.parse(rs.value):[];
}
const rosterSlug=name=>slug(name);

/* ============ Grouping helper ============ */
function grouped(){
  const sorted=[...MATCHES].sort((a,b)=> (a.ord-b.ord) || a.diaSort.localeCompare(b.diaSort) || a.hora.localeCompare(b.hora));
  const out=[];
  let curR=null,curD=null;
  for(const m of sorted){
    if(!curR||curR.rodada!==m.rodada){curR={rodada:m.rodada,days:[]};out.push(curR);curD=null;}
    if(!curD||curD.dia!==m.dia){curD={dia:m.dia,matches:[]};curR.days.push(curD);}
    curD.matches.push(m);
  }
  return out;
}
function flatDays(){
  const sorted=[...MATCHES].sort((a,b)=> (a.ord-b.ord) || a.diaSort.localeCompare(b.diaSort) || a.hora.localeCompare(b.hora));
  const days=[]; let cur=null;
  for(const m of sorted){
    if(!cur||cur.key!==m.diaSort){cur={key:m.diaSort,label:m.dia,rodada:m.rodada,matches:[]};days.push(cur);}
    cur.matches.push(m);
  }
  return days;
}

function matchCardPalpite(m){
  const el=document.createElement('div');el.className='match';
  const res=RESULTS[m.id];
  const pred=currentPreds[m.id];
  const committed = !!(pred && pred.h!=null && pred.a!=null); // já salvou palpite deste jogo
  const timeLocked=isLocked(m);
  const locked = committed || timeLocked;
  const ph=pred&&pred.h!=null?pred.h:'';
  const pa=pred&&pred.a!=null?pred.a:'';
  let statusTag;
  if(committed) statusTag='<span class="lock">🔒 palpite enviado</span>';
  else if(timeLocked) statusTag='<span class="lock">🔒 fechado</span>';
  else statusTag=`<span style="color:var(--green)">aberto até ${closeTime(m)} (Brasília)</span>`;
  el.innerHTML=`
    <div class="meta">
      <span><b>${m.hora}</b> · ${m.city}</span>
      ${statusTag}
    </div>
    <div class="bsb">🇧🇷 ${brasilia(m.kickoff)} (Brasília)</div>
    <div class="row">
      <div class="team home"><span class="nm">${m.home}</span></div>
      <div class="scorebox">
        <input class="sc" type="number" min="0" inputmode="numeric" data-id="${m.id}" data-side="h" value="${ph}" ${locked?'disabled':''}>
        <span class="vs">×</span>
        <input class="sc" type="number" min="0" inputmode="numeric" data-id="${m.id}" data-side="a" value="${pa}" ${locked?'disabled':''}>
      </div>
      <div class="team away"><span class="nm">${m.away}</span></div>
    </div>`;
  if(res){
    const base=baseScore(pred,res);
    const exact=isExact(pred,res);
    const tag=document.createElement('div');tag.className='result-tag';
    let cls=exact?'ex':(base>=3?'ok':(base>0?'ok':'no'));
    let label;
    if(base==null) label='';
    else if(exact) label=`+${base} placar exato${SOLO_BONUS?` (+${SOLO_BONUS} se sozinho)`:''}`;
    else if(base>0) label=`+${base} pts`;
    else label='0 pts';
    tag.innerHTML=`Resultado oficial: <b>${res.h} × ${res.a}</b>` + (label?`<span class="pts ${cls}">${label}</span>`:'');
    el.appendChild(tag);
  }
  return el;
}

async function savePreds(){
  if(!authedSlug){toast('Entre com seu nome e senha primeiro');return;}
  const name=currentName, s=authedSlug;
  // jogos já enviados (definitivos) não podem ser sobrescritos
  const committed={};
  Object.keys(currentPreds).forEach(k=>{
    const p=currentPreds[k];
    if(p && p.h!=null && p.a!=null) committed[k]={h:p.h,a:p.a};
  });
  const preds={...currentPreds};
  document.querySelectorAll('.sc').forEach(inp=>{
    const id=inp.dataset.id, side=inp.dataset.side, v=inp.value;
    if(committed[id]) return; // não mexe em palpite já enviado
    if(!preds[id]) preds[id]={h:null,a:null};
    preds[id][side]= v===''?null:Math.max(0,parseInt(v,10));
  });
  // restaura os definitivos por garantia
  Object.assign(preds, committed);
  // remove entradas vazias (jogos não palpitados)
  Object.keys(preds).forEach(k=>{if(preds[k].h==null||preds[k].a==null)delete preds[k];});
  currentPreds=preds;
  const rec=await getPerson(s); // preserva a senha já cadastrada
  await store.set('bolao:pred:'+s, JSON.stringify({name, pass:(rec&&rec.pass)||null, preds, updated:Date.now()}));
  if(view==='palpites') renderPalpites();
  toast('✅ Palpites de '+name+' enviados!');
}

/* ============ Render: Ranking ============ */
async function renderRanking(){
  const c=$('content'); c.innerHTML='<div class="empty">Calculando ranking…</div>';
  const l=await store.list('bolao:pred:');
  const all=[];
  for(const k of (l.keys||[])){
    const g=await store.get(k); if(!g||!g.value)continue;
    let obj; try{obj=JSON.parse(g.value);}catch(e){continue;}
    all.push({name:obj.name, preds:obj.preds||{}});
  }
  // pré-calcula, para cada jogo com resultado, quantos cravaram o placar exato (bônus de sozinho)
  const exactCount={};
  for(const id in RESULTS){ exactCount[id]=countExact(id, RESULTS[id], all); }

  const people=[];
  for(const obj of all){
    let total=0, exatos=0, resultados=0, solos=0, jogos=0;
    for(const id in obj.preds){
      const res=RESULTS[id]; const base=baseScore(obj.preds[id], res);
      if(base==null) continue;
      jogos++; total+=base;
      if(isExact(obj.preds[id], res)){
        exatos++;
        if(exactCount[id]===1){ total+=SOLO_BONUS; solos++; } // acertou o placar exato SOZINHO
      } else if(base>=3){ resultados++; }
    }
    people.push({name:obj.name,total,exatos,resultados,solos,jogos});
  }
  people.sort((a,b)=> b.total-a.total || b.exatos-a.exatos || a.name.localeCompare(b.name));
  c.innerHTML='';
  const rh=document.createElement('div');rh.className='round-head';rh.textContent='🏆 Classificação';c.appendChild(rh);
  if(!people.length){c.innerHTML+='<div class="empty">Nenhum palpite salvo ainda.<br>Os pontos aparecem quando o organizador lançar os resultados.</div>';return;}
  const card=document.createElement('div');card.className='rank-card';
  people.forEach((p,i)=>{
    const row=document.createElement('div');row.className='rk'+(i<3?' top'+(i+1):'');
    const medal=i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1);
    row.innerHTML=`
      <div class="pos">${medal}</div>
      <div class="who2">${p.name}<small>${p.exatos} placar exato${p.solos?` (${p.solos} sozinho)`:''} · ${p.jogos} jogos pontuados</small></div>
      <div class="score">${p.total}<small> pts</small></div>`;
    card.appendChild(row);
  });
  c.appendChild(card);
}

async function renderAdminPalpites(c){
  const note=document.createElement('div');note.className='note';
  note.innerHTML='Palpites de todos os participantes. Escolha uma pessoa para ver e <b>editar</b> os palpites dela jogo a jogo, ou <b>excluir</b> o participante. A pontuação aparece quando o resultado oficial já tiver sido lançado.';
  c.appendChild(note);

  // carrega todos os participantes
  const l=await store.list('bolao:pred:');
  const people=[];
  const allForBonus=[];
  for(const k of (l.keys||[])){
    const g=await store.get(k); if(!g||!g.value)continue;
    let obj; try{obj=JSON.parse(g.value);}catch(e){continue;}
    allForBonus.push({preds:obj.preds||{}});
    people.push({key:k, name:obj.name, preds:obj.preds||{}, total:0, count:0, updated:obj.updated||0});
  }
  // bônus de sozinho: quantos cravaram o placar exato em cada jogo
  const exactCount={};
  for(const id in RESULTS){ exactCount[id]=countExact(id, RESULTS[id], allForBonus); }
  people.forEach(p=>{
    let total=0,count=0;
    for(const id in p.preds){
      const base=baseScore(p.preds[id],RESULTS[id]); if(base==null) continue;
      count++; total+=base;

    editNote.textContent='Você pode editar qualquer placar abaixo (inclusive jogos já enviados) e salvar. Deixe os dois campos vazios para apagar o palpite daquele jogo.';
    box.appendChild(editNote);

    function persistVisible(){
      // guarda no objeto da pessoa o que estiver visível, antes de trocar de rodada

      toast('Palpites de '+p.name+' atualizados');
      renderAdmin();
    };
  }
  sel.onchange=()=>show(sel.value);
}

async function renderAdminRoster(c){
  const note=document.createElement('div');note.className='note';
  note.innerHTML='Cadastre aqui a <b>lista oficial de participantes</b>. Cada pessoa vai escolher o próprio nome nesta lista (sem digitar) e criar uma senha no primeiro acesso — assim ninguém erra o nome nem usa o nome de outro. Você pode <b>resetar a senha</b> de quem esqueceu.';
  c.appendChild(note);

  // adicionar nome
  const add=document.createElement('div');add.className='addbox';
  add.innerHTML=`
    <div class="day-head" style="margin:0 0 10px">➕ Adicionar participante</div>
    <div style="display:flex;gap:8px">
      <input class="field" id="r_name" placeholder="Nome do participante" autocomplete="off" style="flex:1">
      <button class="btn gold sm" id="r_add">Adicionar</button>
    </div>`;
  c.appendChild(add);

  async function saveRoster(){ await store.set('bolao:roster', JSON.stringify(ROSTER)); }

  $('r_add').onclick=async()=>{
    const nm=$('r_name').value.trim().replace(/\s+/g,' ');
    if(!nm){toast('Digite um nome');return;}
    const s=rosterSlug(nm);
    if(ROSTER.some(n=>rosterSlug(n)===s)){toast('Já existe um participante com esse nome');return;}
    ROSTER.push(nm); await saveRoster(); toast('Participante adicionado'); renderAdmin();
  };
  $('r_name').addEventListener('keydown',e=>{if(e.key==='Enter')$('r_add').click();});

  if(!ROSTER.length){
    const e=document.createElement('div');e.className='empty';e.textContent='Nenhum participante cadastrado ainda.';c.appendChild(e);return;
  }

  const rh=document.createElement('div');rh.className='round-head';rh.textContent=`Participantes (${ROSTER.length})`;c.appendChild(rh);

  // status de cada um (tem senha? já palpitou?)
  for(const nm of ROSTER.slice().sort((a,b)=>a.localeCompare(b))){
    const s=rosterSlug(nm);
    const rec=await getPerson(s);
    const hasPass=!!(rec&&rec.pass);
    const nPal=rec&&rec.preds?Object.keys(rec.preds).length:0;
    const row=document.createElement('div');row.className='rsrow';
    row.innerHTML=`
      <div class="rs-info">
        <b>${nm}</b>
        <small>${hasPass?'🔑 senha definida':'⏳ sem senha (1º acesso pendente)'} · ${nPal} palpites</small>
      </div>
      <div class="rs-acts">
        ${hasPass?`<button class="btn ghost sm" data-reset="${s}">Resetar senha</button>`:''}
        <button class="delx" data-delp="${s}">excluir</button>
      </div>`;
    c.appendChild(row);
    const rb=row.querySelector('[data-reset]');
    if(rb) rb.onclick=async()=>{
      if(!confirm(`Resetar a senha de "${nm}"? Ela poderá criar uma nova senha no próximo acesso (os palpites são mantidos).`))return;
      const r2=await getPerson(s)||{name:nm,preds:{}};
      r2.pass=null; r2.name=nm;
      await store.set('bolao:pred:'+s, JSON.stringify(r2));
      toast('Senha resetada'); renderAdmin();
    };
    row.querySelector('[data-delp]').onclick=async()=>{
      if(!confirm(`Excluir "${nm}" do bolão? Isso remove o nome da lista e todos os palpites dele.`))return;
      ROSTER=ROSTER.filter(n=>rosterSlug(n)!==s); await saveRoster();
      await store.del('bolao:pred:'+s);
      toast('Participante excluído'); renderAdmin();
    };
  }
}

function matchCardAdmin(m){
  const el=document.createElement('div');el.className='match admin-edit';
  const res=RESULTS[m.id]||{h:'',a:''};
  el.innerHTML=`
    <div class="meta"><span>${m.hora}</span><span class="city">${m.city}</span>
      <button class="delx" data-del="${m.id}">excluir</button></div>
    <div class="row">
      <input class="nm-edit" data-edit="${m.id}" data-f="home" value="${m.home}">
      <div class="scorebox">
        <input class="sc" type="number" min="0" inputmode="numeric" data-res="${m.id}" data-side="h" value="${res.h}">
        <span class="vs">×</span>
        <input class="sc" type="number" min="0" inputmode="numeric" data-res="${m.id}" data-side="a" value="${res.a}">
      </div>
      <input class="nm-edit" data-edit="${m.id}" data-f="away" value="${m.away}" style="text-align:right">
    </div>
    <div style="margin-top:10px;display:flex;gap:8px">
      <button class="btn primary sm" style="flex:1" data-save="${m.id}">Salvar resultado</button>
      <button class="btn ghost sm" data-clear="${m.id}">Limpar</button>
    </div>`;
  el.querySelector('[data-save]').onclick=()=>saveResult(m.id);
  el.querySelector('[data-clear]').onclick=()=>clearResult(m.id);
  el.querySelector('[data-del]').onclick=()=>delMatch(m.id);
  return el;
}

async function saveResult(id){
  const h=document.querySelector(`[data-res="${id}"][data-side="h"]`).value;
  const a=document.querySelector(`[data-res="${id}"][data-side="a"]`).value;
  const home=document.querySelector(`[data-edit="${id}"][data-f="home"]`).value.trim();
  const away=document.querySelector(`[data-edit="${id}"][data-f="away"]`).value.trim();
  const m=MATCHES.find(x=>x.id===id);
  if(m){ m.home=home||m.home; m.away=away||m.away; await store.set('bolao:matches',JSON.stringify(MATCHES)); }
  if(h===''||a===''){ toast('Preencha os dois placares'); return; }
  RESULTS[id]={h:Math.max(0,parseInt(h,10)),a:Math.max(0,parseInt(a,10))};
  await store.set('bolao:results',JSON.stringify(RESULTS));
  toast('Resultado salvo');
}
async function clearResult(id){
  delete RESULTS[id]; await store.set('bolao:results',JSON.stringify(RESULTS));
  toast('Resultado removido'); renderAdmin();
}
async function delMatch(id){
  if(!confirm('Excluir este jogo?'))return;
  MATCHES=MATCHES.filter(x=>x.id!==id); delete RESULTS[id];
  await store.set('bolao:matches',JSON.stringify(MATCHES));
  await store.set('bolao:results',JSON.stringify(RESULTS));
  renderAdmin();
}
async function addMatch(){
  const rod=$('a_rod').value.trim(), date=$('a_data').value, hora=$('a_hora').value.trim();
  const home=$('a_home').value.trim(), away=$('a_away').value.trim(), city=$('a_city').value.trim();
  if(!rod||!date||!hora||!home||!away){toast('Preencha rodada, data, hora e os dois times');return;}
  const [Y,M,D]=date.split('-');
  const dow=DOW[new Date(date+'T12:00:00Z').getUTCDay()];
  MATCHES.push({
    id:'kn-'+Date.now(), rodada:rod, ord:(MATCHES.find(x=>x.rodada===rod)?.ord)||100,
    dia:`${dow}, ${D}/${M}`, diaSort:date, hora, kickoff:`${date}T${hora}:00-03:00`,
    home, away, city:city||'—'
  });
  await store.set('bolao:matches',JSON.stringify(MATCHES));
  toast('Jogo adicionado'); renderAdmin();
}

async function renderPinGate(c){
  // relê a senha do organizador direto do banco (evita usar CONFIG desatualizado no celular)
  try{ const cf=await store.get('bolao:config'); if(cf&&cf.value) CONFIG=JSON.parse(cf.value); }catch(e){}
  const setup = !CONFIG.pin;
  const box=document.createElement('div');box.className='pinwrap';
  box.innerHTML=`
    <h3>${setup?'CRIAR SENHA':'MODO ORGANIZADOR'}</h3>
    <p>${setup?'Defina uma senha. Só quem tiver ela poderá lançar os resultados.':'Digite a senha do organizador para lançar resultados.'}</p>
    <input class="field" id="pinInput" type="password" inputmode="numeric" placeholder="${setup?'Nova senha':'Senha'}" style="text-align:center;letter-spacing:4px;margin-bottom:12px">
    <button class="btn primary" id="pinBtn">${setup?'Salvar senha e entrar':'Entrar'}</button>`;
  c.appendChild(box);
  $('pinBtn').onclick=async()=>{
    const v=$('pinInput').value.trim();
    if(!v){toast('Digite a senha');return;}
    // confere de novo no banco no momento de entrar, para não recriar senha por engano
    try{ const cf=await store.get('bolao:config'); if(cf&&cf.value) CONFIG=JSON.parse(cf.value); }catch(e){}
    if(!CONFIG.pin){ CONFIG.pin=v; await store.set('bolao:config',JSON.stringify(CONFIG)); adminUnlocked=true; toast('Senha criada'); renderAdmin(); }
    else if(v===CONFIG.pin){ adminUnlocked=true; renderAdmin(); }
    else { toast('Senha incorreta'); }
  };
  $('pinInput').addEventListener('keydown',e=>{if(e.key==='Enter')$('pinBtn').click();});
}

  if(view==='palpites')renderPalpites();
  else if(view==='ranking')renderRanking();
  else renderAdmin();
}
document.querySelectorAll('.tabs button').forEach(b=>{
  b.onclick=()=>{
    view=b.dataset.view;

    render();

});

/* mantém os palpites em memória enquanto digita (não perde ao trocar de dia) */
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.classList.contains('sc') && t.dataset.id){
    const id=t.dataset.id, side=t.dataset.side;
    if(!currentPreds[id]) currentPreds[id]={h:null,a:null};
    currentPreds[id][side]= t.value===''?null:Math.max(0,parseInt(t.value,10));
  }
});

/* ============ Identidade: login por lista fechada + senha por pessoa ============ */
function renderAuth(){
  const bar=$('idbar');
  if(authedSlug){
    bar.innerHTML=`<div class="who" style="width:100%;justify-content:space-between">
        <span>palpitando como <b>${currentName}</b></span>
        <button class="btn ghost sm" id="logoutBtn">Sair</button>
      </div>`;
    $('logoutBtn').onclick=()=>{ authedSlug=''; currentName=''; currentSlug=''; currentPreds={}; renderAuth(); if(view==='palpites')renderPalpites(); };
    return;
  }
  if(!ROSTER.length){
    bar.innerHTML=`<div class="who" style="width:100%">Nenhum participante foi cadastrado ainda. O organizador precisa cadastrar a lista de nomes na aba <b>Organizador</b>.</div>`;
    return;
  }
  bar.innerHTML=`
    <div class="grow">
      <label>Quem é você?</label>
      <select class="field" id="whoSel">
        <option value="">— Selecione seu nome —</option>
        ${ROSTER.slice().sort((a,b)=>a.localeCompare(b)).map(n=>`<option value="${rosterSlug(n)}">${n}</option>`).join('')}
      </select>
    </div>
    <div class="grow" id="passWrap" style="display:none">
      <label id="passLbl">Sua senha</label>
      <input class="field" id="passInput" type="password" inputmode="numeric" placeholder="Senha" autocomplete="off">
    </div>
    <button class="btn primary" id="authBtn" style="display:none">Entrar</button>`;
  const sel=$('whoSel');
  sel.onchange=async()=>{
    const s=sel.value;
    if(!s){ $('passWrap').style.display='none'; $('authBtn').style.display='none'; return; }
    const rec=await getPerson(s);
    const first=!rec || !rec.pass;
    $('passWrap').style.display='';
    $('authBtn').style.display='';
    $('passLbl').textContent= first? 'Crie uma senha (primeiro acesso)' : 'Sua senha';
    $('passInput').value='';
    $('passInput').placeholder= first? 'Defina uma senha' : 'Senha';
    $('authBtn').textContent= first? 'Cadastrar e entrar' : 'Entrar';
  };
  $('authBtn').onclick=doAuth;
  bar.querySelector('#passInput')&&bar.addEventListener('keydown',e=>{if(e.key==='Enter'&&document.activeElement.id==='passInput')doAuth();});
}

async function doAuth(){
  const s=$('whoSel').value; if(!s){toast('Selecione seu nome');return;}
  const pass=$('passInput').value.trim();
  if(!pass){toast('Digite a senha');return;}
  const name=ROSTER.find(n=>rosterSlug(n)===s);
  const rec=await getPerson(s);
  if(!rec || !rec.pass){
    // primeiro acesso: cria registro com senha
    await store.set('bolao:pred:'+s, JSON.stringify({name, pass, preds:(rec&&rec.preds)||{}, updated:Date.now()}));
    authedSlug=s; currentName=name; currentSlug=s; currentPreds=(rec&&rec.preds)||{};
    toast('Senha criada! Bons palpites, '+name);
  } else if(rec.pass===pass){
    authedSlug=s; currentName=name; currentSlug=s; currentPreds=rec.preds||{};
    toast('Olá, '+name+'!');
  } else { toast('Senha incorreta'); return; }
  renderAuth();
  if(view==='palpites') renderPalpites();
}

(async function(){
  await loadAll();
  renderAuth();
  render();
})();
</script>
